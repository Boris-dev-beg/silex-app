{% load tailwind_tags %} 
{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="{% static 'images/favicon/favicon.ico' %}" type="image/x-icon">
    <title>Login</title>
    {% tailwind_css %}
  </head>
  <body class="max-w-screen min-h-screen flex flex-col items-center justify-center bg-gray-50">
    <header
      class="flex items-center justify-between sticky top-0 py-4 px-6 shadow-lg shadow-gray-100 w-full bg-gray-50"
    >
      <a href="{% url 'index' %}" class="flex items-center gap-2">
        <img
          src="{% static 'images/arrow-small-left.svg' %}"
          alt="image de retour"
          class="size-7"
        />
        <h1 class="text-gray-900 font-bold hover:underline">Retour</h1>
      </a>
      <span class="flex items-center gap-2">
        <img
          src="{% static 'images/home.svg' %}"
          alt="image de maison"
          class="size-6"
        />
        <span>
         <h1 class="text-gray-900 font-bold text-xl">SILEX</h1>
          <p class="italic text-gray-300">Interconnexion Immobiliere</p>
        </span> 
      </span>
    </header>
    <main
      class="flex-1 w-full md:w-2/3 h-full flex flex-col items-center px-4 py-5 gap-3"
    >
      <span
        class="flex gap-3 border-b border-gray-200 w-full items-center justify-center py-4"
      >
        <img
          src="{% static 'images/lock.svg' %}"
          alt="Image de Cadena"
          class="size-7"
        />
        <h1 class="text-3xl font-bold text-gray-900">
          {% block title %}
          <!-- ! Titre -->
          {% endblock %}
        </h1>
      </span>
      {% block content %}
      <!-- ! Code du formulaire -->
      {% endblock %}
      <span
        class="flex flex-col gap-3 items-center justify-center text-blue-800 border-t border-gray-200 w-full py-4"
      >
        {% block footer %}
        <!-- ! Footer -->
        {% endblock %}
      </span>
    </main>
  </body>
</html>
