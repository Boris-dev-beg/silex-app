{% extends "announce/layout.html" %} 
{% load static %}

{% block title %}Home{% endblock %} 

{% block content %}

{% include 'announce/hero.html' %}
<section
  class="relative flex flex-col gap-4 my-5 px-4 items-center justify-center w-full"
>
  <div class="flex items-center justify-between border-y border-gray-200 w-full bg-white pr-3">
    <span
      class="flex gap-2 items-center justify-start px-3 max-[430px]:px-0"
    >
      <img
        src="{% static 'images/fire.png' %}"
        alt="image du feu"
        class="size-7.5 md:size-10 max-[430px]:hidden"
      />
      <h1 class="font-bold text-gray-900 text-2xl py-3 max-[430px]:text-base md:text-3xl lg:text-4xl uppercase">
        Nouvelles Annonces
      </h1>
    </span>
    <span class="flex gap-2 w-fit items-center cursor-pointer group">
      <h1 class="font-semibold group-hover:underline text-slate-900">Voir tout</h1>
      <img src="{% static 'images/right-arrow.png' %}" alt="right" class="size-5 max-[430px]:size-3">
    </span>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 place-items-center w-full">
    {% include 'announce/announce.html' %}
  </div>
</section>
<section class="flex flex-col items-center relative py-3 border-t border-gray-200 w-full my-8">
  <h1 class="uppercase font-bold bg-gray-100 p-2 absolute -top-5 max-[430px]:text-xl max-[430px]:text-center text-3xl md:text-4xl text-slate-900">pourquoi choisir SILEX ?</h1>
  {% include 'announce/why_us.html' %}
</section>
{% endblock %}
