{% load static %}

<div class="grid max-[330px]:grid-cols-1 grid-cols-2 md:grid-cols-3 place-items-center gap-8 py-8 items-center justify-center w-full">
    <div class="flex flex-col gap-2 items-center justify-center sm:w-2/3">
        <img src="{% static 'images/shield.png' %}" alt="shield" class="size-30">
        <span class="flex flex-col items-center">
            <h1 class="font-bold">Sécurité</h1>
            <p class="text-center line-clamp-2">Bailleurs verifiés et transactions claires.</p>
        </span>
    </div>
    <div class="flex flex-col gap-2 items-center justify-center sm:w-2/3">
        <img src="{% static 'images/chrono (1).png' %}" alt="shield" class="size-30">
        <span class="flex flex-col items-center">
            <h1 class="font-bold">Rapidité</h1>
            <p class="text-center line-clamp-2">Trouvez et contactez en quelques clics seulement.</p>
        </span>
    </div>
    <div class="flex flex-col gap-2 items-center justify-center sm:w-2/3">
        <img src="{% static 'images/invesment.png' %}" alt="shield" class="size-30">
        <span class="flex flex-col items-center">
            <h1 class="font-bold">Choix</h1>
            <p class="text-center line-clamp-2">Des centaines de logements mis à jour.</p>
        </span>
