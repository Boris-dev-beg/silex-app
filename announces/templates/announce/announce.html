{% load static %} 
{% load humanize %} 

{% for announce in announces %}
<div class="rounded-md bg-white shadow-md shadow-gray-200 w-full md:w-4/5 lg:w-full">
  <div class="grid grid-cols-1 min-[400px]:flex w-full h-auto">
    <span class="relative h-40 min:[340x]:w-50 w-full rounded-md">
      <img
        src="/media/{{announce.main_image}}"
        alt="image du meuble"
        class="absolute inset-0 size-full object-cover rounded-md"
      />
    </span>
    <span class="text-slate-800 flex flex-col justify-between p-2 gap-1 w-full h-40">
      <h1 class="font-bold text-2xl line-clamp-2">{{ announce.title }}</h1>
      <span class="w-full p-2 flex gap-1 border-b border-gray-200">
        <img
          src="{% static 'images/placeholder.png' %}"
          alt="image de la localisation"
          class="size-5"
        />
        <h1>{{ announce.district }}, Bafoussam</h1>
      </span>
      <span class="w-full px-2 py-1 flex gap-1 border-b border-gray-200 text-emerald-500">
        <img
          src="{% static 'images/money-bags.png' %}"
          alt="image de l'argent"
          class="size-5"
        />
        <h1 class="text-[18px] md:text-[19px]">{{ announce.price|floatformat:1|intcomma }} FCFA / mois</h1>
      </span>
    </span>
  </div>
  <div class="grid grid-cols-1 gap-2 min-[400px]:flex min-[420px]:gap-12 lg:gap-5 min-[420px]:p-4 px-4 py-2 items-center justify-center w-full">
    <a href="{% url 'details' announce.id %}"
      class="bg-emerald-500 text-white border border-gray-300 text-[18px] py-2 px-5 text-center font-bold rounded-md shadow shadow-gray-300"
    >
      Voir les details
    </a>
    <a href="https://wa.me/237{{announce.author.user_phone}}?text='Bonjour {{announce.author}}, je suis intereser par votre {{announce.title}}'"
      class="flex items-center gap-2 bg-emerald-500 text-white border border-gray-300 text-[18px] py-2 px-10 text-center font-bold rounded-md shadow shadow-gray-300"
    >
      <img
        src="{% static 'images/whatsapp.png' %}"
        alt="image de whatsapp"
        class="size-7"
      />
      WhatsApp
    </a>
  </div>
</div>
{% endfor %}
